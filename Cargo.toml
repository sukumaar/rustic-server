[package]
name = "rustic-server"
version = "0.1.0"
edition = "2021"
authors = ["Sukumaar"]

[lib]
name = "_rustic"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = "0.8"
pyo3 = { version = "0.27", features = ["abi3-py310"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
