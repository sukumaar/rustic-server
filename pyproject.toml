[project]
name = "rustic-server"
version = "0.1.0"
description = "Python declarations for a Rust REST server"
authors = [{ name = "Sukumaar" }]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "rustic_server._rustic"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
